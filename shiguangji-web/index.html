<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <link rel="icon" href="/favicon.ico" />
    <title>%VITE_APP_TITLE%</title>
    <script>
      // 提前同步日夜模式（与 VueUse useDark 同一存储键），避免启动屏与首屏闪色
      ;(function () {
        try {
          var scheme = localStorage.getItem("vueuse-color-scheme")
          var dark =
            scheme === "dark" ||
            ((scheme === null || scheme === "auto") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) document.documentElement.classList.add("dark")
        } catch (e) {}
      })()
    </script>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0px;
        padding: 0px;
      }

      /* ===== 拾光记启动屏（冷雾胶片 v3.3） =====
         胶片齿孔曝光波纹呼应登录页 film-strip，
         退场缓动与设计稿动效一致：cubic-bezier(.23, 1, .32, 1)。 */
      #sgj-loader {
        --loader-bg-a: #fbfcfb;
        --loader-bg-b: #f1f3f2;
        --loader-ink: #262b2a;
        --loader-text-3: #7d8783;
        --loader-text-4: #a4ada9;
        --loader-perf: #d5dcd9;
        --loader-accent: #a85f52;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          120% 90% at 50% 40%,
          var(--loader-bg-a) 0%,
          var(--loader-bg-b) 68%
        );
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        user-select: none;
        transition:
          opacity 0.48s cubic-bezier(0.23, 1, 0.32, 1),
          transform 0.48s cubic-bezier(0.23, 1, 0.32, 1),
          visibility 0s 0.48s;
      }

      html.dark #sgj-loader {
        --loader-bg-a: #1c2220;
        --loader-bg-b: #171b1a;
        --loader-ink: #eef2f0;
        --loader-text-3: #96a09b;
        --loader-text-4: #6e7974;
        --loader-perf: #39423e;
        --loader-accent: #c27a6d;
      }

      /* 退场：main.ts 挂载完成后加 .is-done */
      #sgj-loader.is-done {
        opacity: 0;
        transform: translateY(-8px);
        visibility: hidden;
      }

      /* 胶片齿孔：依次曝光 */
      .sgj-film {
        display: flex;
        gap: 14px;
        margin-bottom: 40px;
      }

      .sgj-film .perf {
        width: 26px;
        height: 10px;
        border-radius: 5px;
        background: var(--loader-perf);
        animation: sgj-expose 1.5s ease-in-out infinite;
        animation-delay: calc(var(--i) * 0.13s);
      }

      @keyframes sgj-expose {
        0%,
        100% {
          background: var(--loader-perf);
          transform: scale(1);
        }
        50% {
          background: var(--loader-accent);
          transform: scale(1.15);
        }
      }

      /* 字标：逐字浮起 */
      .sgj-word {
        font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
        font-weight: 700;
        font-size: 40px;
        line-height: 1.3;
        letter-spacing: 6px;
        padding-left: 6px; /* 抵消末字 letter-spacing，保持视觉居中 */
        color: var(--loader-ink);
      }

      .sgj-word span {
        display: inline-block;
        opacity: 0;
        transform: translateY(8px);
        animation: sgj-rise 0.48s cubic-bezier(0.23, 1, 0.32, 1) both;
        animation-delay: calc(0.15s + var(--i) * 0.08s);
      }

      @keyframes sgj-rise {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .sgj-word-en {
        margin-top: 10px;
        font-size: 11px;
        letter-spacing: 3px;
        color: var(--loader-text-4);
      }

      .sgj-slogan {
        margin-top: 30px;
        font-size: 14px;
        letter-spacing: 1px;
        color: var(--loader-text-3);
      }

      .sgj-hint {
        margin-top: 10px;
        font-size: 13px;
        color: var(--loader-text-3);
      }

      .sgj-hint .dot {
        display: inline-block;
        margin-left: 2px;
        animation: sgj-dot 1.5s ease-in-out infinite;
        animation-delay: calc(var(--i) * 0.2s);
      }

      @keyframes sgj-dot {
        0%,
        100% {
          opacity: 0.15;
        }
        40% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #sgj-loader,
        .sgj-film .perf,
        .sgj-word span,
        .sgj-hint .dot {
          animation: none !important;
          transition: none !important;
        }
        .sgj-word span {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <div id="sgj-loader" role="status" aria-label="正在加载">
      <div class="sgj-film" aria-hidden="true">
        <span class="perf" style="--i: 0"></span>
        <span class="perf" style="--i: 1"></span>
        <span class="perf" style="--i: 2"></span>
        <span class="perf" style="--i: 3"></span>
        <span class="perf" style="--i: 4"></span>
        <span class="perf" style="--i: 5"></span>
        <span class="perf" style="--i: 6"></span>
      </div>
      <div class="sgj-word" aria-hidden="true">
        <span style="--i: 0">拾</span><span style="--i: 1">光</span><span style="--i: 2">记</span>
      </div>
      <div class="sgj-word-en" aria-hidden="true">S H I G U A N G J I</div>
      <div class="sgj-slogan" aria-hidden="true">把日子，过成照片</div>
      <div class="sgj-hint">
        正在拾取时光<i class="dot" style="--i: 0">·</i><i class="dot" style="--i: 1">·</i
        ><i class="dot" style="--i: 2">·</i>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
