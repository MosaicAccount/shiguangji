<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>拾光记 · 足迹页改版设计稿</title>
<style>
  /* ============ 设计令牌：拾光记现有设计语言 ============ */
  :root {
    --paper: #f6f1e8;
    --paper-deep: #efe7d8;
    --ink: #2e3331;
    --ink-2: #5c6360;
    --ink-3: #97a09b;
    --primary: #a85f52;
    --primary-dark: #8c4a3f;
    --primary-soft: #f2e2dd;
    --moss: #5d6f66;
    --amber: #c08a3e;
    --card: #ffffff;
    --border: #e7dfd0;
    --shadow: 0 4px 16px rgba(23, 27, 26, .08);
    --shadow-lift: 0 10px 28px rgba(23, 27, 26, .16);
    --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
    --sans: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    --r: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--paper); color: var(--ink); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }

  /* ============ 站点导航（示意） ============ */
  .site-nav {
    height: 54px; padding: 0 clamp(16px, 4vw, 56px);
    display: flex; align-items: center; gap: 26px;
    background: var(--card); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
  }
  .site-nav .logo { font: 700 17px/1 var(--serif); letter-spacing: 2px; color: var(--primary-dark); }
  .site-nav .nav-item { font-size: 13.5px; color: var(--ink-2); cursor: default; }
  .site-nav .nav-item.active {
    color: var(--primary); font-weight: 600;
    padding-bottom: 4px; border-bottom: 2px solid var(--primary);
  }
  .site-nav .nav-tip { margin-left: auto; font-size: 11px; color: var(--ink-3); }

  /* ============ 页面横幅 ============ */
  .page-banner {
    position: relative; overflow: hidden;
    margin: 20px clamp(16px, 4vw, 56px) 0;
    padding: 34px clamp(20px, 4vw, 56px);
    border-radius: 24px; background: #282e2c; color: #e7ece9;
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  }
  .page-banner .blob { position: absolute; border-radius: 50%; pointer-events: none; }
  .page-banner .b1 { width: 300px; height: 300px; right: -40px; top: -120px; background: rgba(168, 95, 82, .35); }
  .page-banner .b2 { width: 200px; height: 200px; right: 140px; bottom: -90px; background: rgba(93, 111, 102, .4); }
  .banner-text { position: relative; z-index: 1; }
  .banner-text h1 { font: 700 34px/1.3 var(--serif); }
  .banner-text p { margin-top: 8px; font-size: 13.5px; color: #aeb8b3; letter-spacing: .5px; }
  .banner-stats { position: relative; z-index: 1; display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .stat-chip {
    padding: 7px 14px; border-radius: 999px;
    background: rgba(231, 236, 233, .1); border: 1px solid rgba(231, 236, 233, .22);
    font-size: 12.5px; color: #d8e0db;
  }
  .stat-chip b { color: #f0c9a8; font-family: var(--serif); font-size: 15px; margin: 0 3px; }
  .banner-add {
    position: relative; z-index: 1; margin-left: auto;
    height: 44px; padding: 0 26px; border-radius: 22px;
    background: var(--primary); color: #fff; font-size: 13px; letter-spacing: 1px;
    transition: background .16s ease, transform .16s ease;
  }
  .banner-add:hover { background: var(--primary-dark); transform: translateY(-1px); }

  /* ============ 筛选栏 ============ */
  .filter-bar {
    margin: 18px clamp(16px, 4vw, 56px) 4px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .mode-seg {
    display: flex; background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px; box-shadow: var(--shadow);
  }
  .mode-seg button {
    padding: 7px 20px; border-radius: 999px; font-size: 13px; color: var(--ink-2);
    display: flex; align-items: center; gap: 6px;
  }
  .mode-seg button.on { background: var(--primary); color: #fff; font-weight: 600; }
  .filter-pill {
    padding: 8px 18px; border: 1px solid var(--border); border-radius: 17px;
    background: var(--card); color: var(--ink-2); font-size: 13px;
    transition: all .16s ease;
  }
  .filter-pill:hover { border-color: var(--primary); color: var(--primary); }
  .filter-pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .filter-pill[hidden], .search-box[hidden], .tag-row[hidden] { display: none; }
  .search-box { margin-left: auto; position: relative; }
  .search-box input {
    width: 220px; height: 38px; padding: 0 14px 0 34px;
    border: 1px solid var(--border); border-radius: 19px;
    background: var(--card); font: inherit; font-size: 13px; color: var(--ink);
  }
  .search-box .icon { position: absolute; left: 12px; top: 9px; color: var(--ink-3); }
  .tag-row { margin: 10px clamp(16px, 4vw, 56px) 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .tag-pill-f {
    padding: 4px 14px; border-radius: 999px; font-size: 12px;
    background: var(--card); border: 1px solid var(--border); color: var(--ink-2);
  }
  .tag-pill-f.on { background: var(--moss); border-color: var(--moss); color: #fff; }

  /* ============ 内容区 ============ */
  .page-body { padding: 16px clamp(16px, 4vw, 56px) 60px; }

  /* ---- 地图模式 ---- */
  .map-mode { animation: rise .24s ease; }
  .map-canvas {
    position: relative; height: 540px;
    background:
      radial-gradient(60% 50% at 72% 30%, #f0e6d2 0%, transparent 70%),
      radial-gradient(45% 45% at 18% 70%, #e4e9df 0%, transparent 70%),
      radial-gradient(50% 40% at 45% 85%, #efe0d6 0%, transparent 70%),
      var(--paper-deep);
    border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(34px); opacity: .5; pointer-events: none; }
  .blob.b1 { width: 34%; height: 42%; left: 60%; top: 8%;  background: #dfe8d2; }
  .blob.b2 { width: 26%; height: 36%; left: 6%;  top: 22%; background: #e9e2c8; }
  .blob.b3 { width: 22%; height: 26%; left: 40%; top: 62%; background: #e8d8ce; }
  .region-label {
    position: absolute; transform: translate(-50%, -50%);
    font: 600 13px/1 var(--serif); letter-spacing: 6px;
    color: rgba(92, 99, 96, .38); pointer-events: none; user-select: none;
  }
  .route { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .map-tip {
    position: absolute; top: 14px; right: 14px;
    font-size: 12px; color: var(--ink-2);
    background: rgba(255,255,255,.85); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
  }
  .map-legend {
    position: absolute; left: 14px; bottom: 14px;
    display: flex; gap: 14px; font-size: 12px; color: var(--ink-2);
    background: rgba(255,255,255,.85); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
  }
  .legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .legend-dot.visited { background: var(--moss); }
  .legend-dot.want { background: var(--amber); }

  .marker { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 5px; z-index: 5; }
  .marker .lift { display: block; transition: transform .18s ease; }
  .marker:hover .lift, .marker:focus-visible .lift { transform: translateY(-4px); }
  .mini-deck { position: relative; width: 46px; height: 52px; display: block; }
  .mini-deck i {
    position: absolute; bottom: 0; left: 50%; width: 34px; height: 44px;
    border: 3px solid #fff; border-radius: 7px;
    box-shadow: 0 2px 6px rgba(23,27,26,.25);
    transform-origin: 50% 115%;
    background-size: cover; background-position: center;
  }
  .mini-deck i:nth-child(1) { transform: translateX(-50%) rotate(-16deg); }
  .mini-deck i:nth-child(2) { transform: translateX(-50%) rotate(-3deg); z-index: 1; }
  .mini-deck i:nth-child(3) { transform: translateX(-50%) rotate(11deg); z-index: 2; }
  .mini-deck.single i:nth-child(1) { width: 40px; height: 50px; transform: translateX(-50%) rotate(-4deg); }
  .g0 { background-image: linear-gradient(160deg, #f8d8b0, #e8a37c); }
  .g1 { background-image: linear-gradient(160deg, #bfe0d8, #6fa8a0); }
  .g2 { background-image: linear-gradient(160deg, #cfe0c3, #8aa883); }
  .g3 { background-image: linear-gradient(160deg, #d8c3e0, #9a7fb8); }
  .g4 { background-image: linear-gradient(160deg, #f0e3c0, #d0b070); }
  .g5 { background-image: linear-gradient(160deg, #c9d4dd, #7d93a8); }
  .g6 { background-image: linear-gradient(160deg, #f2cfc5, #d98a80); }
  .g7 { background-image: linear-gradient(160deg, #c5d8cf, #5f7f72); }
  .tag-pill {
    font-size: 12px; font-weight: 600; white-space: nowrap;
    padding: 2px 10px; border-radius: 999px;
    background: #fff; border: 1px solid var(--primary); color: var(--primary);
    box-shadow: 0 2px 6px rgba(23,27,26,.12);
  }
  .tag-pill.muted { border-color: var(--border); color: var(--ink-2); box-shadow: none; }
  .plain-dot { display: block; width: 13px; height: 13px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 1px 5px rgba(23,27,26,.35); }
  .plain-dot.visited { background: var(--moss); }
  .plain-dot.want { background: var(--amber); }

  /* 聚合弹卡 */
  .cluster-pop {
    position: absolute; z-index: 30; width: 268px;
    background: var(--card); border-radius: 14px; box-shadow: var(--shadow-lift);
    border: 1px solid var(--border); padding: 12px; display: none;
    animation: pop-in .18s ease;
  }
  .cluster-pop.open { display: block; }
  .pop-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .pop-title { font: 700 14px/1.3 var(--serif); }
  .pop-sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .pop-close { width: 24px; height: 24px; border-radius: 50%; color: var(--ink-2); font-size: 14px; line-height: 1; }
  .pop-close:hover { background: var(--paper); }
  .pop-group { width: 100%; text-align: left; border-radius: 10px; padding: 8px; display: block; }
  .pop-group:hover { background: var(--paper); }
  .pop-group + .pop-group { margin-top: 2px; }
  .g-name { display: flex; justify-content: space-between; align-items: baseline; width: 100%; }
  .g-name b { font-size: 13px; }
  .g-name span { font-size: 11px; color: var(--ink-3); }
  .pop-thumbs { display: flex; gap: 5px; margin-top: 6px; }
  .pop-thumbs .pt {
    width: 34px; height: 34px; border-radius: 7px; border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(23,27,26,.2);
    background-size: cover; background-position: center; display: block;
  }
  .pop-thumbs .pt.more {
    display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink-2); font-size: 10px; border: 1px dashed var(--border); box-shadow: none;
  }
  @keyframes pop-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ---- 旅行时间线 ---- */
  .timeline { margin-top: 18px; }
  .tl-title { font: 700 15px/1 var(--serif); color: var(--ink-2); margin-bottom: 12px; display: flex; align-items: baseline; gap: 8px; }
  .tl-title small { font: 400 12px/1 var(--sans); color: var(--ink-3); }
  .tl-track {
    position: relative; display: flex; gap: 26px;
    overflow-x: auto; padding: 6px 4px 14px;
  }
  .tl-track::before {
    content: ""; position: absolute; left: 30px; right: 30px; top: 34px;
    border-top: 2px dashed rgba(168, 95, 82, .35);
  }
  .tl-item { position: relative; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 92px; }
  .tl-item .thumb {
    width: 56px; height: 56px; border-radius: 50%;
    border: 3px solid #fff; box-shadow: 0 3px 10px rgba(23,27,26,.2);
    background-size: cover; background-position: center;
    transition: transform .18s ease;
  }
  .tl-item:hover .thumb { transform: translateY(-3px) scale(1.05); }
  .tl-item .tl-name { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .tl-item .tl-date { font-size: 11px; color: var(--ink-3); font-family: var(--serif); }

  /* ---- 卡片模式 ---- */
  .card-mode { animation: rise .24s ease; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .place-card {
    background: var(--card); border-radius: 16px; overflow: hidden;
    box-shadow: var(--shadow); cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease;
    display: flex; flex-direction: column;
  }
  .place-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lift); }
  .card-cover { position: relative; aspect-ratio: 16 / 10; display: flex; align-items: center; justify-content: center; }
  .card-cover .cover-ph { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .card-cover .glyph { font: 700 44px/1 var(--serif); color: var(--primary-dark); }
  .card-cover .type-pill {
    position: absolute; top: 12px; left: 12px; padding: 2px 10px;
    border-radius: 10px; background: rgba(255,255,255,.92); color: var(--ink-2); font-size: 11px;
  }
  .card-cover .photo-badge {
    position: absolute; top: 12px; right: 12px; padding: 2px 10px;
    border-radius: 999px; background: rgba(40, 46, 44, .78); color: #f0ece2; font-size: 11px;
  }
  .card-body { padding: 14px 16px 16px; flex: 1; }
  .card-title { font: 700 16px/1.4 var(--serif); margin-bottom: 4px; }
  .card-loc { font-size: 12px; color: var(--ink-3); }
  .card-comment {
    margin-top: 8px; font-size: 12px; color: var(--ink-2); line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .empty-tip { grid-column: 1 / -1; text-align: center; color: var(--ink-3); padding: 40px 0; font-size: 13px; }

  /* ============ 详情抽屉（右侧内嵌/移动全覆盖） ============ */
  .drawer-mask { position: fixed; inset: 0; z-index: 58; background: rgba(30,34,32,.35); display: none; }
  .drawer-mask.open { display: block; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 60;
    width: 400px; background: var(--card);
    box-shadow: -12px 0 40px rgba(23,27,26,.18);
    overflow-y: auto; display: none; flex-direction: column;
  }
  .drawer.open { display: flex; animation: slide-in .22s ease; }
  @keyframes slide-in { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .drawer-head { padding: 18px 20px 14px; border-bottom: 1px dashed var(--border); display: flex; align-items: flex-start; gap: 10px; }
  .drawer-head h2 { font: 700 22px/1.3 var(--serif); }
  .drawer-head .meta { margin-top: 6px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
  .status-tag { font-size: 11px; padding: 2px 9px; border-radius: 999px; color: #fff; }
  .status-tag.DONE { background: var(--moss); }
  .status-tag.WANT { background: var(--amber); }
  .drawer-close { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; font-size: 16px; color: var(--ink-2); flex: none; }
  .drawer-close:hover { background: var(--paper); }
  .drawer-body { padding: 18px 20px 26px; }
  .place-line { font-size: 13px; color: var(--ink-2); line-height: 1.7; }
  .place-line b { color: var(--ink); font-weight: 600; }
  .place-comment { margin-top: 12px; padding: 10px 14px; background: var(--primary-soft); border-radius: 12px; font-size: 13px; color: var(--primary-dark); line-height: 1.7; }

  .album-sec { margin-top: 20px; }
  .album-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .album-head h3 { font: 700 15px/1 var(--serif); color: var(--ink-2); }
  .album-head .count { font-size: 12px; color: var(--ink-3); }
  .deck-wrap { display: flex; align-items: flex-end; gap: 16px; padding: 18px 4px 8px; }
  .deck { position: relative; width: 158px; height: 128px; flex: none; }
  .deck .card {
    position: absolute; bottom: 0; left: 50%;
    width: 88px; height: 116px;
    background: #fff; border-radius: 10px; padding: 5px 5px 20px;
    box-shadow: 0 3px 10px rgba(23,27,26,.22);
    transform: translateX(-50%) rotate(var(--a));
    transform-origin: 50% 118%;
    transition: transform .22s ease;
  }
  .deck .card .ph { display: block; width: 100%; height: 100%; border-radius: 6px; background-size: cover; background-position: center; }
  .deck .card .cap {
    position: absolute; left: 0; right: 0; bottom: 4px;
    font: 600 10px/1 var(--serif); color: var(--ink-2); text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px;
  }
  .deck:hover .card, .deck:focus-visible .card { transform: translateX(-50%) translateY(-7px) rotate(calc(var(--a) * 1.4)); }
  .deck-count {
    position: absolute; top: -2px; right: 2px; z-index: 9;
    min-width: 30px; height: 30px; padding: 0 8px;
    background: var(--primary); color: #fff;
    border: 2.5px solid #fff; border-radius: 999px;
    font-size: 12px; font-weight: 700; line-height: 25px; text-align: center;
    box-shadow: 0 3px 8px rgba(140, 74, 63, .4);
  }
  .deck-hint { font-size: 12px; color: var(--ink-3); line-height: 1.6; padding-bottom: 10px; }
  .deck-hint b { color: var(--primary); font-weight: 600; }
  .album-empty {
    margin-top: 12px; padding: 26px 16px; border: 1.5px dashed var(--border);
    border-radius: 14px; text-align: center; color: var(--ink-3); font-size: 13px; line-height: 1.8;
  }
  .album-empty .big { font-size: 26px; }

  /* ============ 相册弹窗 ============ */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(30, 34, 32, .55);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .overlay.open { display: flex; }
  .album-modal {
    width: min(860px, 100%); max-height: min(78vh, 720px);
    background: var(--paper); border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
    display: flex; flex-direction: column; overflow: hidden;
    animation: rise .22s ease;
  }
  .m-head { padding: 16px 22px 12px; display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--border); background: var(--card); }
  .m-head h2 { font: 700 19px/1.3 var(--serif); }
  .m-head .count { font-size: 12px; color: var(--ink-3); }
  .m-head .drawer-close { margin-left: auto; }
  .album-scroll { overflow-y: auto; padding: 18px 22px 8px; flex: 1; }
  .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 16px 14px; padding-bottom: 6px; }
  .polaroid {
    background: #fff; border-radius: 6px; padding: 7px 7px 26px; position: relative;
    box-shadow: 0 2px 8px rgba(23,27,26,.14);
    transition: transform .2s ease, box-shadow .2s ease;
    display: block; width: 100%; text-align: left;
  }
  .polaroid:nth-child(odd) { transform: rotate(-1.1deg); }
  .polaroid:nth-child(even) { transform: rotate(1deg); }
  .polaroid:hover, .polaroid:focus-visible { transform: rotate(0) translateY(-4px); box-shadow: var(--shadow-lift); z-index: 2; }
  .polaroid .ph { display: block; width: 100%; aspect-ratio: 4 / 3.4; border-radius: 3px; background-size: cover; background-position: center; }
  .polaroid .cap {
    position: absolute; left: 9px; bottom: 6px; right: 9px;
    font: 600 11px/1.3 var(--serif); color: var(--ink-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .polaroid .cap .no { color: var(--ink-3); font-weight: 400; margin-right: 5px; }
  .m-foot { padding: 12px 22px 16px; text-align: center; border-top: 1px solid var(--border); background: var(--card); }
  .load-more {
    padding: 9px 30px; border-radius: 999px;
    background: var(--primary); color: #fff; font-size: 13px; font-weight: 600;
    transition: background .16s ease;
  }
  .load-more:hover:not(:disabled) { background: var(--primary-dark); }
  .load-more:disabled { opacity: .65; cursor: default; }
  .load-more .spin {
    display: inline-block; width: 12px; height: 12px; margin-right: 6px;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%;
    animation: spin .7s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .end-note, .status-line { font-size: 12px; color: var(--ink-3); }
  .status-line { margin-top: 7px; }
  .skel { border-radius: 6px; background: linear-gradient(100deg, #eee6d8 40%, #f6f0e4 50%, #eee6d8 60%); background-size: 200% 100%; animation: shimmer 1.1s infinite; }
  .polaroid.skel .ph { aspect-ratio: 4 / 3.4; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ============ 灯箱 ============ */
  .lightbox { flex-direction: column; gap: 14px; }
  .lightbox .stage-ph {
    width: min(72vw, 720px); aspect-ratio: 4 / 3;
    border-radius: 12px; border: 8px solid #fff;
    box-shadow: 0 24px 60px rgba(0,0,0,.4);
    background-size: cover; background-position: center;
  }
  .lightbox .lb-cap { color: #f0ece2; font: 600 15px/1 var(--serif); letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .lightbox .drawer-close { position: fixed; top: 18px; right: 22px; background: rgba(255,255,255,.12); color: #fff; width: 38px; height: 38px; font-size: 18px; }

  /* Toast（范围外操作的边界提示） */
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px);
    z-index: 200; padding: 10px 20px; border-radius: 999px;
    background: rgba(40, 46, 44, .92); color: #e7ece9; font-size: 12.5px;
    opacity: 0; pointer-events: none; transition: all .25s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  @media (max-width: 860px) {
    .site-nav { gap: 16px; }
    .site-nav .nav-tip { display: none; }
    .banner-add { margin-left: 0; }
    .map-canvas { height: 54vh; }
    .cluster-pop { left: 12px !important; right: 12px; width: auto; } /* 窄屏弹卡全宽，避免出画 */
    .search-box { margin-left: 0; }
    .search-box input { width: 100%; }
    .search-box { flex: 1 1 100%; }
    .drawer { width: 100%; }
    .album-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px 10px; }
    .overlay { padding: 12px; }
    .timeline { display: none; } /* 移动端以地图为主体，时间线让位 */
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<nav class="site-nav" aria-label="站点导航">
  <span class="logo">拾光记</span>
  <span class="nav-item">首页</span>
  <span class="nav-item">电影</span>
  <span class="nav-item">书籍</span>
  <span class="nav-item active">足迹</span>
  <span class="nav-item">笔记</span>
  <span class="nav-tip">足迹页改版设计稿 · 地图模式替代旧路线图</span>
</nav>

<header class="page-banner">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="banner-text">
    <h1>足迹</h1>
    <p>记录你去过和想去的地方。</p>
  </div>
  <div class="banner-stats" id="bannerStats"></div>
  <button class="banner-add" id="btnAdd">＋ 添加想去</button>
</header>

<div class="filter-bar">
  <div class="mode-seg" role="tablist" aria-label="浏览模式">
    <button id="modeCard" role="tab" aria-selected="false">🃏 卡片</button>
    <button id="modeMap" role="tab" aria-selected="true" class="on">🗺 地图</button>
  </div>
  <button class="filter-pill" data-status="DONE" hidden>去过</button>
  <button class="filter-pill" data-status="WANT" hidden>想去</button>
  <div class="search-box" hidden>
    <span class="icon">⌕</span>
    <input id="searchInput" type="search" placeholder="搜索地点" aria-label="搜索地点" />
  </div>
</div>
<div class="tag-row" id="tagRow" hidden></div>

<main class="page-body">
  <!-- 地图模式（替代旧路线图） -->
  <section class="map-mode" id="mapMode">
    <div class="map-canvas" id="mapCanvas">
      <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
      <span class="region-label" style="left:70%;top:72%">江南</span>
      <span class="region-label" style="left:20%;top:66%">青海湖畔</span>
      <span class="region-label" style="left:14%;top:20%">河西走廊</span>
      <svg class="route" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M66,60 C 68,54 69,50 70,48 C 71,52 72,58 74,64 C 58,64 40,54 24,52"
              fill="none" stroke="#a85f52" stroke-width="2"
              stroke-dasharray="5 4" opacity=".45" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="map-tip">📷 照片按就近区域聚合 · 点击聚合牌翻看回忆</div>
      <div class="map-legend">
        <span><i class="legend-dot visited"></i>去过</span>
        <span><i class="legend-dot want"></i>想去</span>
        <span>🂠 照片聚合</span>
      </div>
      <div id="markers"></div>
    </div>
    <!-- 旅行时间线：按年份串联去过的地方 -->
    <div class="timeline">
      <div class="tl-title">旅行时间线 <small>按到访年份 · 点击回看</small></div>
      <div class="tl-track" id="tlTrack"></div>
    </div>
  </section>

  <!-- 卡片模式 -->
  <section class="card-mode" id="cardMode" hidden>
    <div class="card-grid" id="cardGrid"></div>
  </section>
</main>

<!-- 抽屉遮罩 + 详情抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer" aria-label="地点详情" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="drawer-head">
    <div>
      <h2 id="dTitle">—</h2>
      <div class="meta" id="dMeta"></div>
    </div>
    <button class="drawer-close" id="dClose" aria-label="关闭详情">✕</button>
  </div>
  <div class="drawer-body" id="dBody"></div>
</aside>

<!-- 相册弹窗 -->
<div class="overlay" id="albumOverlay">
  <div class="album-modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" id="albumModal">
    <div class="m-head">
      <h2 id="mTitle">—</h2>
      <span class="count" id="mCount"></span>
      <button class="drawer-close" id="mClose" aria-label="关闭相册">✕</button>
    </div>
    <div class="album-scroll">
      <div class="album-grid" id="mGrid"></div>
    </div>
    <div class="m-foot">
      <div id="mFoot"></div>
      <div class="status-line" id="mStatus" role="status"></div>
    </div>
  </div>
</div>

<!-- 灯箱 -->
<div class="overlay lightbox" id="lightbox">
  <button class="drawer-close" id="lbClose" aria-label="关闭大图">✕</button>
  <div class="stage-ph" id="lbPh"></div>
  <div class="lb-cap" id="lbCap"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
/* =============== 示意数据 =============== */
const CAPS = {
  xihu:    ['晨雾','断桥','游船','苏堤','落日','荷花','远山','细雨','倒影','夜色','石舫','柳浪','莺啼','雷峰塔','白堤','曲院','平湖','秋月','灯影','鹭影','茶田','画舫','烟雨','暮色'],
  qinghai: ['湖岸','经幡','油菜花','星空','骑行'],
  suzhou:  ['漏窗','假山','曲径','亭影','竹林','池鱼','月门','回廊'],
  wuzhen:  ['水阁','乌篷船','灯影'],
  dunhuang: []
};
const PLACES = {
  wuzhen:  { name: '乌镇',     city: '嘉兴', status: 'DONE', date: '2023-10', x: 66, y: 60, tags: ['人文','美食'], comment: '夜里的水阁亮起灯，乌篷船摇过，像走进旧照片。' },
  suzhou:  { name: '苏州园林', city: '苏州', status: 'DONE', date: '2024-04', x: 70, y: 48, tags: ['人文'], comment: '一步一漏窗，移步换景，古人诚不我欺。' },
  xihu:    { name: '西湖',     city: '杭州', status: 'DONE', date: '2024-05', x: 74, y: 64, tags: ['自然','人文'], comment: '五月的苏堤刚落过雨，柳絮沾在伞沿上，走了三万步也不想停。' },
  qinghai: { name: '青海湖',   city: '海北', status: 'DONE', date: '2024-07', x: 24, y: 52, tags: ['自然'], comment: '湖和天在远处融成一条线，油菜花黄得晃眼。' },
  dunhuang:{ name: '敦煌',     city: '酒泉', status: 'WANT', date: null,      x: 14, y: 34, tags: ['人文','艺术'], comment: '想在秋天去，看莫高窟和鸣沙山的落日。' }
};
function genPhotos(id) {
  return CAPS[id].map((cap, i) => ({ cap, g: (i * 3 + id.length) % 8 }));
}
for (const id in PLACES) { PLACES[id].id = id; PLACES[id].photos = genPhotos(id); }
const CLUSTERS = [
  { x: 71, y: 58, label: '江南', places: ['xihu', 'suzhou', 'wuzhen'] },
  { x: 24, y: 52, label: '青海湖', places: ['qinghai'] }
];
const DOT_PLACES = ['dunhuang'];
const TAGS = ['自然', '人文', '美食', '艺术'];

/* =============== 工具 =============== */
const $ = s => document.querySelector(s);
const imgStyle = ph => (ph && ph.img) ? ` style="background-image:url('${ph.img}')"` : '';
const mapCanvas = $('#mapCanvas');
let currentPlaceId = null, lastFocus = null;

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.classList.remove('show'), 2200);
}

/* =============== 横幅统计 =============== */
function renderStats() {
  const all = Object.values(PLACES);
  const visited = all.filter(p => p.status === 'DONE');
  const total = all.reduce((s, p) => s + p.photos.length, 0);
  const latest = visited.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
  $('#bannerStats').innerHTML = `
    <span class="stat-chip">去过<b>${visited.length}</b>城</span>
    <span class="stat-chip">留下<b>${total}</b>张照片</span>
    <span class="stat-chip">最近<b>${latest ? latest.name : '—'}</b></span>`;
}

/* =============== 地图标记 =============== */
function photoTotal(ids) { return ids.reduce((s, id) => s + PLACES[id].photos.length, 0); }
function renderMarkers() {
  const wrap = $('#markers');
  wrap.innerHTML = '';
  CLUSTERS.forEach(c => {
    const total = photoTotal(c.places);
    const many = c.places.length > 1 || PLACES[c.places[0]].photos.length > 1;
    const btn = document.createElement('button');
    btn.className = 'marker';
    btn.style.left = c.x + '%'; btn.style.top = c.y + '%';
    btn.setAttribute('aria-label', `${c.label}区域 ${c.places.length} 个地点 共 ${total} 张照片，点击查看`);
    btn.innerHTML = `
      <span class="lift">
        <span class="mini-deck ${many ? '' : 'single'}" aria-hidden="true">
          ${c.places.slice(0, 3).map(pid => {
            const ph = PLACES[pid].photos[0];
            return `<i class="${ph.img ? '' : 'g' + ph.g}"${imgStyle(ph)}></i>`;
          }).join('')}
        </span>
      </span>
      <span class="tag-pill">${c.label} · ${total}张</span>`;
    btn.addEventListener('click', e => { e.stopPropagation(); openClusterPop(c, btn); });
    wrap.appendChild(btn);
  });
  DOT_PLACES.forEach(pid => {
    const p = PLACES[pid];
    const btn = document.createElement('button');
    btn.className = 'marker';
    btn.style.left = p.x + '%'; btn.style.top = p.y + '%';
    if (p.photos.length) {
      const n = Math.min(3, p.photos.length);
      btn.setAttribute('aria-label', `${p.name}，${p.photos.length} 张照片，点击查看`);
      btn.innerHTML = `
        <span class="lift">
          <span class="mini-deck ${p.photos.length > 1 ? '' : 'single'}" aria-hidden="true">
            ${p.photos.slice(0, n).map(ph => `<i class="${ph.img ? '' : 'g' + ph.g}"${imgStyle(ph)}></i>`).join('')}
          </span>
        </span>
        <span class="tag-pill">${p.name} · ${p.photos.length}张</span>`;
      btn.addEventListener('click', e => { e.stopPropagation(); openClusterPop({ x: p.x, y: p.y, label: p.name, places: [pid] }, btn); });
    } else {
      btn.setAttribute('aria-label', `${p.name}，${p.status === 'DONE' ? '去过' : '想去'}，暂无照片，点击查看详情`);
      btn.innerHTML = `
        <span class="lift"><span class="plain-dot ${p.status === 'DONE' ? 'visited' : 'want'}"></span></span>
        <span class="tag-pill muted">${p.name} · ${p.status === 'DONE' ? '去过' : '想去'}</span>`;
      btn.addEventListener('click', () => showPlace(pid, btn));
    }
    wrap.appendChild(btn);
  });
}

/* =============== 聚合弹卡 =============== */
let popEl = null, popTrigger = null;
function closeClusterPop() {
  if (popEl) { popEl.remove(); popEl = null; if (popTrigger) { popTrigger.focus(); popTrigger = null; } }
}
function openClusterPop(cluster, trigger) {
  if (popEl && popTrigger === trigger) { closeClusterPop(); return; }
  closeClusterPop(); closeAlbum();
  popTrigger = trigger;
  popEl = document.createElement('div');
  popEl.className = 'cluster-pop open';
  const flip = cluster.x > 60;
  popEl.style.left = `calc(${cluster.x}% + ${flip ? -282 : 28}px)`;
  popEl.style.top = `calc(${cluster.y}% - 30px)`;
  const groups = cluster.places.map(pid => {
    const p = PLACES[pid], th = p.photos.slice(0, 5), more = p.photos.length - th.length;
    return `
      <button class="pop-group" data-place="${pid}" aria-label="查看${p.name}的相册，共${p.photos.length}张">
        <span class="g-name"><b>${p.name} <small style="color:var(--ink-3);font-weight:400">· ${p.city}</small></b><span>${p.photos.length} 张 →</span></span>
        <span class="pop-thumbs">
          ${th.map(ph => `<i class="pt${ph.img ? '' : ' g' + ph.g}"${imgStyle(ph)} aria-hidden="true"></i>`).join('')}
          ${more > 0 ? `<i class="pt more">+${more}</i>` : ''}
        </span>
      </button>`;
  }).join('');
  popEl.innerHTML = `
    <div class="pop-head">
      <div><div class="pop-title">${cluster.label}的照片</div><div class="pop-sub">附近 ${cluster.places.length} 个地点 · 共 ${photoTotal(cluster.places)} 张</div></div>
      <button class="pop-close" aria-label="关闭聚合照片">✕</button>
    </div>
    ${groups}`;
  popEl.querySelector('.pop-close').addEventListener('click', closeClusterPop);
  popEl.querySelectorAll('.pop-group').forEach(g =>
    g.addEventListener('click', () => { closeClusterPop(); showPlace(g.dataset.place); }));
  mapCanvas.appendChild(popEl);
  popEl.querySelector('.pop-close').focus();
}
mapCanvas.addEventListener('click', () => { if (popEl) closeClusterPop(); });

/* =============== 旅行时间线 =============== */
function renderTimeline() {
  const visited = Object.values(PLACES)
    .filter(p => p.status === 'DONE')
    .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  $('#tlTrack').innerHTML = visited.map(p => {
    const ph = p.photos[0];
    return `
      <button class="tl-item" data-place="${p.id}" aria-label="回看 ${p.date} 到访的${p.name}">
        <span class="thumb ${ph.img ? '' : 'g' + ph.g}"${imgStyle(ph)} aria-hidden="true"></span>
        <span class="tl-name">${p.name}</span>
        <span class="tl-date">${p.date}</span>
      </button>`;
  }).join('');
  $('#tlTrack').querySelectorAll('.tl-item').forEach(b =>
    b.addEventListener('click', () => showPlace(b.dataset.place, b)));
}

/* =============== 卡片模式 =============== */
const cardState = { status: 'DONE', q: '', tag: '' };
function renderCards() {
  const list = Object.values(PLACES).filter(p =>
    p.status === cardState.status &&
    (!cardState.q || p.name.includes(cardState.q)) &&
    (!cardState.tag || p.tags.includes(cardState.tag)));
  const grid = $('#cardGrid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty-tip">没有符合条件的地点</div>`;
    return;
  }
  grid.innerHTML = list.map(p => {
    const ph = p.photos[0];
    return `
      <button class="place-card" data-place="${p.id}" aria-label="查看${p.name}详情${p.photos.length ? `，${p.photos.length} 张照片` : ''}">
        <span class="card-cover">
          ${p.photos.length
            ? `<span class="cover-ph ${ph.img ? '' : 'g' + ph.g}"${imgStyle(ph)} aria-hidden="true"></span><span class="type-pill">地点</span><span class="photo-badge">📷 ${p.photos.length}</span>`
            : `<span class="glyph" aria-hidden="true">地</span><span class="type-pill">地点</span>`}
        </span>
        <span class="card-body">
          <span class="card-title">${p.name}</span>
          <span class="card-loc">${[p.city, p.status === 'DONE' ? p.date : '想去'].filter(Boolean).join(' · ')}</span>
          ${p.comment ? `<span class="card-comment">${p.comment}</span>` : ''}
        </span>
      </button>`;
  }).join('');
  grid.querySelectorAll('.place-card').forEach(c =>
    c.addEventListener('click', () => showPlace(c.dataset.place, c)));
}

function renderTagRow() {
  $('#tagRow').innerHTML = TAGS.map(t =>
    `<button class="tag-pill-f${cardState.tag === t ? ' on' : ''}" data-tag="${t}" aria-pressed="${cardState.tag === t}">${t}</button>`).join('');
  $('#tagRow').querySelectorAll('.tag-pill-f').forEach(b =>
    b.addEventListener('click', () => {
      cardState.tag = cardState.tag === b.dataset.tag ? '' : b.dataset.tag;
      renderTagRow(); renderCards();
    }));
}

/* =============== 模式切换 =============== */
function switchMode(mode) {
  const isMap = mode === 'map';
  $('#modeMap').classList.toggle('on', isMap);
  $('#modeCard').classList.toggle('on', !isMap);
  $('#modeMap').setAttribute('aria-selected', isMap);
  $('#modeCard').setAttribute('aria-selected', !isMap);
  $('#mapMode').hidden = !isMap;
  $('#cardMode').hidden = isMap;
  document.querySelectorAll('.filter-pill').forEach(b => b.hidden = isMap);
  $('.search-box').hidden = isMap;
  $('#tagRow').hidden = isMap;
}
$('#modeMap').addEventListener('click', () => switchMode('map'));
$('#modeCard').addEventListener('click', () => switchMode('card'));
document.querySelectorAll('.filter-pill').forEach(b =>
  b.addEventListener('click', () => {
    cardState.status = b.dataset.status;
    document.querySelectorAll('.filter-pill').forEach(x =>
      x.classList.toggle('active', x.dataset.status === cardState.status));
    renderCards();
  }));
$('#searchInput').addEventListener('input', e => { cardState.q = e.target.value.trim(); renderCards(); });

/* =============== 详情抽屉 =============== */
const drawer = $('#drawer'), drawerMask = $('#drawerMask');
function showPlace(pid, trigger) {
  if (trigger) lastFocus = trigger;
  currentPlaceId = pid;
  const p = PLACES[pid];
  $('#dTitle').textContent = p.name;
  $('#dMeta').innerHTML = `<span class="status-tag ${p.status}">${p.status === 'DONE' ? '去过' : '想去'}</span>
    <span>${p.city}</span>${p.date ? `<span>· ${p.date} 到访</span>` : ''}`;
  const n = p.photos.length;
  let albumHtml;
  if (!n) {
    albumHtml = `
      <div class="album-empty">
        <div class="big">🖼</div>
        还没有照片<br><span style="font-size:12px">登录后可在地点详情上传旅途照片</span>
      </div>`;
  } else {
    const cards = p.photos.slice(0, 4);
    const angles = [-16, -6, 5, 15];
    albumHtml = `
      <div class="deck-wrap">
        <button class="deck" id="deckBtn" aria-label="打开${p.name}相册，共 ${n} 张照片">
          ${cards.map((ph, i) => `
            <span class="card" style="--a:${angles[i]}deg; z-index:${i}" aria-hidden="true">
              <span class="ph${ph.img ? '' : ' g' + ph.g}"${imgStyle(ph)}></span><span class="cap">${ph.cap}</span>
            </span>`).join('')}
          <span class="deck-count" aria-hidden="true">${n}</span>
        </button>
        <p class="deck-hint">一叠旅途的牌<br><b>点击展开相册</b>，逐页翻看</p>
      </div>`;
  }
  $('#dBody').innerHTML = `
    <p class="place-line"><b>${p.city}</b> · ${p.status === 'DONE' ? `${p.date} 到访` : '计划中'}</p>
    ${p.comment ? `<div class="place-comment">「${p.comment}」</div>` : ''}
    <section class="album-sec">
      <div class="album-head"><h3>照片</h3><span class="count">${n ? n + ' 张' : ''}</span></div>
      ${albumHtml}
    </section>`;
  drawer.classList.add('open');
  drawerMask.classList.add('open');
  $('#dBody').scrollTop = 0;
  const deckBtn = $('#deckBtn');
  if (deckBtn) deckBtn.addEventListener('click', () => openAlbum(pid));
  $('#dClose').focus();
}
function closeDrawer() {
  drawer.classList.remove('open');
  drawerMask.classList.remove('open');
  if (lastFocus) { lastFocus.focus(); lastFocus = null; }
}
$('#dClose').addEventListener('click', closeDrawer);
drawerMask.addEventListener('click', closeDrawer);

/* =============== 相册弹窗（分页） =============== */
const PAGE = 8;
const albumOverlay = $('#albumOverlay');
let album = null;
function openAlbum(pid) {
  const p = PLACES[pid];
  album = { pid, shown: 0 };
  $('#mTitle').textContent = `${p.name} · 相册`;
  $('#mCount').textContent = `共 ${p.photos.length} 张`;
  $('#mGrid').innerHTML = '';
  $('#mFoot').innerHTML = '';
  $('#mStatus').textContent = '';
  albumOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  loadMore();
  $('#mClose').focus();
}
function closeAlbum() {
  if (!albumOverlay.classList.contains('open')) return;
  albumOverlay.classList.remove('open');
  document.body.style.overflow = '';
  album = null;
  const d = $('#deckBtn');
  if (d && drawer.classList.contains('open')) d.focus();
}
function appendPolaroids(pid, start, n) {
  const p = PLACES[pid];
  const frag = document.createDocumentFragment();
  for (let i = start; i < start + n; i++) {
    const ph = p.photos[i];
    const idx = i;
    const b = document.createElement('button');
    b.className = 'polaroid';
    b.setAttribute('aria-label', `查看照片：${ph.cap}`);
    b.innerHTML = `<span class="ph${ph.img ? '' : ' g' + ph.g}"${imgStyle(ph)}></span>
      <span class="cap"><span class="no">${String(idx + 1).padStart(2, '0')}</span>${ph.cap}</span>`;
    b.addEventListener('click', () => openLightbox(p, idx));
    frag.appendChild(b);
  }
  album.shown += n;
  $('#mGrid').appendChild(frag);
}
function refreshAlbumFoot() {
  const p = PLACES[album.pid];
  $('#mCount').textContent = `共 ${p.photos.length} 张`;
  $('#mStatus').textContent = `已显示 ${album.shown} / ${p.photos.length} 张`;
  const foot = $('#mFoot');
  if (album.shown < p.photos.length) {
    foot.innerHTML = `<button class="load-more" id="lmBtn">加载更多照片</button>`;
    $('#lmBtn').addEventListener('click', loadMore);
  } else {
    foot.innerHTML = `<div class="end-note">— 已经到底啦 · 共 ${p.photos.length} 张 —</div>`;
  }
}
function loadMore() {
  const p = PLACES[album.pid];
  const foot = $('#mFoot');
  foot.innerHTML = `<button class="load-more" id="lmBtn" disabled><span class="spin"></span>正在装载照片…</button>`;
  $('#mStatus').textContent = `已显示 ${album.shown} / ${p.photos.length} 张`;
  const grid = $('#mGrid');
  const skels = [];
  for (let i = 0; i < Math.min(PAGE, p.photos.length - album.shown); i++) {
    const s = document.createElement('span');
    s.className = 'polaroid skel';
    s.innerHTML = `<span class="ph"></span>`;
    grid.appendChild(s);
    skels.push(s);
  }
  setTimeout(() => {
    if (!album) return;
    const start = album.shown;
    const n = Math.min(PAGE, p.photos.length - album.shown);
    skels.forEach(el => el.remove());
    appendPolaroids(album.pid, start, n);
    refreshAlbumFoot();
  }, 650);
}
$('#mClose').addEventListener('click', closeAlbum);
albumOverlay.addEventListener('click', e => { if (e.target === albumOverlay) closeAlbum(); });

/* =============== 灯箱 =============== */
const lightbox = $('#lightbox');
function openLightbox(place, idx) {
  const ph = place.photos[idx];
  const lb = $('#lbPh');
  if (ph.img) { lb.className = 'stage-ph'; lb.style.backgroundImage = `url('${ph.img}')`; }
  else { lb.className = 'stage-ph g' + ph.g; lb.style.backgroundImage = ''; }
  $('#lbCap').textContent = `${place.name} · ${ph.cap}（${idx + 1}/${place.photos.length}）`;
  lightbox.classList.add('open');
  $('#lbClose').focus();
}
function closeLightbox() {
  lightbox.classList.remove('open');
  const first = albumOverlay.querySelector('.polaroid:not(.skel)');
  if (first) first.focus();
}
$('#lbClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

/* =============== 键盘 =============== */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (lightbox.classList.contains('open')) return closeLightbox();
    if (albumOverlay.classList.contains('open')) return closeAlbum();
    if (popEl) return closeClusterPop();
    if (drawer.classList.contains('open')) return closeDrawer();
  }
  if (e.key === 'Tab') {
    const top = lightbox.classList.contains('open') ? lightbox
      : albumOverlay.classList.contains('open') ? $('#albumModal') : null;
    if (!top) return;
    const focusables = top.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
  }
});

/* =============== 范围外操作 =============== */
$('#btnAdd').addEventListener('click', () => toast('「添加想去」表单沿用现有弹窗，不在本次设计范围'));

/* =============== 启动 =============== */
renderStats();
renderMarkers();
renderTimeline();
renderTagRow();
renderCards();
</script>
</body>
